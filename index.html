<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Froggy June Challenge</title>
    <style>
        /* 1. CLOUDY LAYER (The very bottom) */
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #5d6d7e url('cloudy_bg.PNG') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Arial', sans-serif; 
            user-select: none; 
        }

        /* 2. SUNNY LAYER (Fades in without affecting the frog) */
        #sunny-bg {
            position: fixed;
            inset: 0;
            background: url('sunny_bg.PNG') no-repeat center center fixed;
            background-size: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1; /* Sits above clouds but below frog */
        }

        /* 3. GAME CONTAINER (Always 100% visible) */
        #game-box { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            z-index: 5; /* Sits on top of the backgrounds */
        }
        
        #player { 
            position: absolute; bottom: 60px; left: 50%; 
            width: 80px; height: 80px; transform: translateX(-50%);
            z-index: 20;
            transition: filter 0.1s ease-out;
        }

        #ui { position: absolute; top: 20px; left: 20px; z-index: 30; color: white; text-shadow: 2px 2px 5px black; }
        #energy-container { width: 160px; height: 15px; background: #333; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
        #energy-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s; }

        #side-bar { 
            position: absolute; right: 25px; top: 10%; height: 80%; 
            width: 25px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 20px; 
            z-index: 30;
        }
        #weather-fill { position: absolute; bottom: 0; width: 100%; height: 0%; background: linear-gradient(to top, #ffcc33, #87ceeb); border-radius: 18px; transition: height 0.3s; }
        
        .item { position: absolute; z-index: 15; }

        .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        #end-screen.win-style { 
    background: rgba(255, 255, 255, 0); /* Completely transparent background */
    color: #2c3e50; 
    text-shadow: 0 0 15px white, 0 0 5px white; /* Glow makes text readable on sun */
}
        
        button { padding: 15px 50px; font-size: 24px; cursor: pointer; border: none; background: #2ecc71; color: white; border-radius: 50px; margin: 10px; font-weight: bold; }
        .hide { display: none !important; }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .confetti { position: absolute; font-size: 30px; animation: float-up 3s linear forwards; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

<!-- This is the background that will fade -->
<div id="sunny-bg"></div>

<div id="game-box">
    <div id="ui">
        Energy: <div id="energy-container"><div id="energy-bar"></div></div>
        Score: <span id="score-val">0</span> / 15 | Time: <span id="timer-val">0.0</span>s
    </div>

    <div id="side-bar">
        <span class="icon" style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; top: -40px;">☀️</span>
        <div id="weather-fill"></div>
        <span class="icon" style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; bottom: -40px;">⛈️</span>
    </div>

    <div id="player"><img src="frog.png" style="width:80px; height:auto;"></div>

    <div id="start-screen" class="screen">
        <h1>🐸 June Rain Dodge</h1>
        <p>Use <b>Left Arrow</b> and <b>Right Arrow</b> to move!</p>
        <button onclick="Game.start(4)">Easy</button>
        <button onclick="Game.start(7)">Normal</button>
        <button onclick="Game.start(11)">Hard</button>
    </div>

    <div id="end-screen" class="screen hide">
        <h1 id="res-title"></h1>
        <p id="res-stats"></p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
const Game = {
    active: false,
    score: 0,
    energy: 100,
    items: [],
    speed: 5,
    startTime: 0,
    playerX: window.innerWidth / 2,
    keys: { left: false, right: false },

    start(speed) {
        this.speed = speed;
        this.active = true;
        this.startTime = Date.now();
        document.getElementById('start-screen').classList.add('hide');
        
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") this.keys.left = true;
            if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") this.keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") this.keys.left = false;
            if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") this.keys.right = false;
        });

        this.spawn();
        this.update();
    },

    spawn() {
        if(!this.active) return;
        const el = document.createElement('div');
        const isRain = Math.random() > 0.15; 
        el.className = 'item';
        el.innerHTML = isRain ? 
            '<img src="rain.png" style="width:40px; height:auto;">' : 
            '<img src="bug.png" style="width:45px; height:auto;">';
            
        el.style.left = Math.random() * (window.innerWidth - 60) + 'px';
        el.style.top = '-60px';
        document.getElementById('game-box').appendChild(el);
        this.items.push({ el, y: -60, type: isRain ? 'rain' : 'bug', speed: this.speed + (Math.random() * 2) });
        setTimeout(() => this.spawn(), 100);
    },

    update() {
        if(!this.active) return;

        if (this.keys.left) this.playerX -= 12;
        if (this.keys.right) this.playerX += 12;
        this.playerX = Math.max(40, Math.min(window.innerWidth - 40, this.playerX));
        document.getElementById('player').style.left = this.playerX + 'px';

        document.getElementById('timer-val').innerText = ((Date.now() - this.startTime) / 1000).toFixed(1);

        const pRect = document.getElementById('player').getBoundingClientRect();

        for (let i = this.items.length - 1; i >= 0; i--) {
            const item = this.items[i];
            item.y += item.speed;
            item.el.style.top = item.y + 'px';
            const iRect = item.el.getBoundingClientRect();

            if (!(iRect.right < pRect.left || iRect.left > pRect.right || iRect.bottom < pRect.top || iRect.top > pRect.bottom)) {
                if (item.type === 'bug') {
                    this.score++;
                    this.flashGreen();
                    this.updateWeather();
                } else {
                    this.energy -= 20;
                    this.flashRed();
                    document.getElementById('energy-bar').style.width = this.energy + '%';
                }
                item.el.remove();
                this.items.splice(i, 1);
                if (this.energy <= 0) { this.end(false); return; }
                if (this.score >= 15) { this.end(true); return; }
                continue;
            }
            if (item.y > window.innerHeight) {
                item.el.remove();
                this.items.splice(i, 1);
            }
        }
        requestAnimationFrame(() => this.update());
    },

    flashRed() {
        const p = document.getElementById('player').querySelector('img');
        if(p) {
            p.style.filter = "brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(10) drop-shadow(0 0 10px red)";
            setTimeout(() => p.style.filter = "none", 150);
        }
    },

    flashGreen() {
        const p = document.getElementById('player').querySelector('img');
        if(p) {
            p.style.filter = "brightness(1.2) sepia(1) hue-rotate(70deg) saturate(10) drop-shadow(0 0 15px #2ecc71)";
            setTimeout(() => p.style.filter = "none", 150);
        }
    },

    updateWeather() {
        const p = this.score / 15;
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('weather-fill').style.height = (p * 100) + '%';
        
        // --- FIXED: Target the separate sunny layer ---
        document.getElementById('sunny-bg').style.opacity = p;
    },

    celebrate() {
        const icons = ['✨', '🎉', '🌻', '🦋', '🎈', '☀️'];
        for(let i=0; i<30; i++) {
            setTimeout(() => {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.innerText = icons[Math.floor(Math.random() * icons.length)];
                c.style.left = Math.random() * 100 + 'vw';
                document.getElementById('game-box').appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }, i * 100);
        }
    },

    end(win) {
        this.active = false;
        const screen = document.getElementById('end-screen');
        screen.classList.remove('hide');
        
        if(win) {
            // 1. CLEAR ALL RAIN AND BUGS IMMEDIATELY
            this.items.forEach(item => item.el.remove());
            this.items = []; // Empty the tracking array

            screen.classList.add('win-style');
            document.getElementById('res-title').innerText = "☀️ THE SUN IS OUT!";
            
            // 2. LOCK SUNNY BACKGROUND TO FULL CLARITY
            document.getElementById('sunny-bg').style.opacity = 1; 
            
            // 3. START CELEBRATION
            this.celebrate();
        } else {
            document.getElementById('res-title').innerText = "⛈️ TOO MUCH RAIN";
        }
        document.getElementById('res-stats').innerText = `Time Taken: ${document.getElementById('timer-val').innerText}s`;
    }
};
</script>
</body>
</html>

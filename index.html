<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Froggy Alphabet Challenge</title>
    <style>
        /* 1. CLOUDY LAYER (The very bottom) */
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #5d6d7e url('./cloudy_bg.PNG') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Arial', sans-serif; 
            user-select: none; 
        }

        /* 2. SUNNY LAYER */
        #sunny-bg {
            position: fixed;
            inset: 0;
            background: url('./sunny_bg.PNG') no-repeat center center fixed;
            background-size: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1;
        }

        /* 3. GAME CONTAINER */
        #game-box { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            z-index: 5;
        }
        
        #player { 
            position: absolute; bottom: 60px; left: 50%; 
            width: 80px; height: 80px; transform: translateX(-50%);
            z-index: 20;
            transition: filter 0.1s ease-out;
        }

        #ui { position: absolute; top: 20px; left: 20px; z-index: 30; color: white; text-shadow: 2px 2px 5px black; font-size: 20px; }
        #energy-container { width: 160px; height: 15px; background: #333; border: 2px solid #fff; border-radius: 10px; overflow: hidden; margin-bottom: 5px; }
        #energy-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s; }

        /* ALPHABET SIDEBAR TRACKER */
        #side-bar { 
            position: absolute; right: 20px; top: 5%; height: 90%; 
            width: 120px; background: rgba(0, 0, 0, 0.6); border: 2px solid #fff; border-radius: 15px; 
            z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 10px;
            box-sizing: border-box; align-content: center;
        }
        .tracker-letter {
            color: rgba(255, 255, 255, 0.2); font-weight: bold; font-size: 20px; text-align: center;
            background: rgba(255, 255, 255, 0.05); border-radius: 4px; padding: 2px 0; transition: all 0.3s;
        }
        .tracker-letter.collected {
            color: #ffcc33; background: rgba(255, 204, 51, 0.3); text-shadow: 0 0 8px #ffcc33; transform: scale(1.1);
        }
        
        /* FALLING ALPHABET LETTERS */
        .item { position: absolute; z-index: 15; }
        .falling-letter {
            font-size: 42px; font-weight: bold; color: #ffcc33;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 2px 2px 10px rgba(0,0,0,0.8);
            font-family: 'Arial Black', sans-serif;
        }

        /* SCREENS & MENUS */
        .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        
        .instructions-box {
            background: rgba(255, 255, 255, 0.1); border: 2px dashed #2ecc71; border-radius: 15px;
            padding: 15px 30px; margin: 20px 0; max-width: 420px; font-size: 18px; line-height: 1.5;
        }
        .key-cap {
            background: #fff; color: #333; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-family: monospace;
        }

        #countdown-screen { background: rgba(0,0,0,0.85); font-size: 120px; font-weight: bold; color: #ffcc33; text-shadow: 0 0 30px #ffcc33; z-index: 110; }
        #end-screen.win-style { background: rgba(255, 255, 255, 0); color: #2c3e50; text-shadow: 0 0 15px white, 0 0 5px white; }
        
        button { padding: 15px 50px; font-size: 24px; cursor: pointer; border: none; background: #2ecc71; color: white; border-radius: 50px; margin: 10px; font-weight: bold; }
        .hide { display: none !important; }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .confetti { position: absolute; font-size: 30px; animation: float-up 3s linear forwards; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

<div id="sunny-bg"></div>

<div id="game-box">
    <div id="ui">
        Energy: <div id="energy-container"><div id="energy-bar"></div></div>
        Letters Found: <span id="score-val">0</span> / 26 | Time: <span id="timer-val">0.0</span>s
    </div>

    <div id="side-bar">
        <!-- Dynamically filled by JavaScript -->
    </div>

    <div id="player"><img src="./frog.png" style="width:80px; height:auto;"></div>

    <div id="start-screen" class="screen">
        <h1>🐸 June Alphabet Eater</h1>
        
        <div class="instructions-box">
            <h3>🎮 HOW TO PLAY:</h3>
            アルファベットの 文字(もじ)を あつめて、aからzまで かんせいさせよう！<br>
            あめを よけてね！ ⛈️<br>
            むしを つかまえると、エネルギーが<b>もらえるよ！</b> 🦟<br><br>
            ひだりにうごく: <span class="key-cap">← Arrow</span> か <span class="key-cap">&lt;</span><br>
            みぎにうごく: <span class="key-cap">→ Arrow</span> か <span class="key-cap">&gt;</span>
        </div>

        <button onclick="Game.triggerCountdown(4)">Easy</button>
        <button onclick="Game.triggerCountdown(7)">Normal</button>
        <button onclick="Game.triggerCountdown(11)">Hard</button>
    </div>

    <div id="countdown-screen" class="screen hide"></div>

    <div id="end-screen" class="screen hide">
        <h1 id="res-title"></h1>
        <p id="res-stats"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
const Game = {
    active: false,
    collectedLetters: new Set(),
    items: [],
    speed: 5,
    startTime: 0,
    playerX: window.innerWidth / 2,
    keys: { left: false, right: false },
    alphabet: 'abcdefghijklmnopqrstuvwxyz'.split(''),
    energy: 100,

    initTracker() {
        const sidebar = document.getElementById('side-bar');
        sidebar.innerHTML = '';
        this.alphabet.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'tracker-letter';
            div.id = `track-${letter}`;
            div.innerText = letter;
            sidebar.appendChild(div);
        });
    },

    triggerCountdown(speed) {
        document.getElementById('start-screen').classList.add('hide');
        const countdownScreen = document.getElementById('countdown-screen');
        countdownScreen.classList.remove('hide');
        
        this.initTracker();
        
        let count = 3;
        countdownScreen.innerText = count;
        
        const interval = setInterval(() => {
            count--;
            if (count > 0) {
                countdownScreen.innerText = count;
            } else if (count === 0) {
                countdownScreen.innerText = "GO!";
            } else {
                clearInterval(interval);
                countdownScreen.classList.add('hide');
                this.start(speed);
            }
        }, 1000);
    },

    start(speed) {
        this.speed = speed;
        this.active = true;
        this.startTime = Date.now();
        this.energy = 100;
        this.collectedLetters.clear();
        document.getElementById('energy-bar').style.width = '100%';
        
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") this.keys.left = true;
            if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") this.keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === "ArrowLeft" || e.key === "<" || e.key === ",") this.keys.left = false;
            if (e.key === "ArrowRight" || e.key === ">" || e.key === ".") this.keys.right = false;
        });

        this.spawn();
        this.update();
    },

    spawn() {
        if(!this.active) return;
        const el = document.createElement('div');
        el.className = 'item';
        
        const rand = Math.random();
        let itemType = 'rain';
        let assignedLetter = '';

        // --- SPAWNING RATIOS ---
        if (rand < 0.70) { 
            // 70% chance: Rain
            itemType = 'rain';
            el.innerHTML = '<img src="./rain.png" style="width:40px; height:auto;">';
        } else if (rand < 0.97) { 
            // 23% chance: Letter
            itemType = 'letter';
            assignedLetter = this.alphabet[Math.floor(Math.random() * this.alphabet.length)];
            el.innerHTML = `<div class="falling-letter">${assignedLetter}</div>`;
        } else { 
            // 7% chance: Bug (Rare recovery item)
            itemType = 'bug';
            el.innerHTML = '<img src="./bug.png" style="width:45px; height:auto;">';
        }
            
        el.style.left = Math.random() * (window.innerWidth - 60) + 'px';
        el.style.top = '-60px';
        document.getElementById('game-box').appendChild(el);
        
        this.items.push({ 
            el, 
            y: -60, 
            type: itemType, 
            letter: assignedLetter,
            speed: this.speed + (Math.random() * 2) 
        });
        
        setTimeout(() => this.spawn(), 150);
    },

    update() {
        if(!this.active) return;

        if (this.keys.left) this.playerX -= 12;
        if (this.keys.right) this.playerX += 12;
        this.playerX = Math.max(40, Math.min(window.innerWidth - 40, this.playerX));
        document.getElementById('player').style.left = this.playerX + 'px';

        document.getElementById('timer-val').innerText = ((Date.now() - this.startTime) / 1000).toFixed(1);

        const pRect = document.getElementById('player').getBoundingClientRect();

        for (let i = this.items.length - 1; i >= 0; i--) {
            const item = this.items[i];
            item.y += item.speed;
            item.el.style.top = item.y + 'px';
            const iRect = item.el.getBoundingClientRect();

            if (!(iRect.right < pRect.left || iRect.left > pRect.right || iRect.bottom < pRect.top || iRect.top > pRect.bottom)) {
                
                if (item.type === 'letter') {
                    this.flashGreen();
                    this.collectedLetters.add(item.letter);
                    const trackEl = document.getElementById(`track-${item.letter}`);
                    if(trackEl) trackEl.classList.add('collected');
                    this.updateScoreboard();

                } else if (item.type === 'bug') {
                    // NEW: Bug gives health back up to max 100%
                    this.energy = Math.min(100, this.energy + 8);
                    this.flashGreen();
                    document.getElementById('energy-bar').style.width = this.energy + '%';

                } else {
                    this.energy -= 8;
                    this.flashRed();
                    document.getElementById('energy-bar').style.width = this.energy + '%';
                }

                item.el.remove();
                this.items.splice(i, 1);
                
                if (this.energy <= 0) { this.end(false); return; }
                if (this.collectedLetters.size >= 26) { this.end(true); return; }
                continue;
            }
            if (item.y > window.innerHeight) {
                item.el.remove();
                this.items.splice(i, 1);
            }
        }
        requestAnimationFrame(() => this.update());
    },

    flashRed() {
        const p = document.getElementById('player').querySelector('img');
        if(p) {
            p.style.filter = "brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(10) drop-shadow(0 0 10px red)";
            setTimeout(() => p.style.filter = "none", 150);
        }
    },

    flashGreen() {
        const p = document.getElementById('player').querySelector('img');
        if(p) {
            p.style.filter = "brightness(1.2) sepia(1) hue-rotate(70deg) saturate(10) drop-shadow(0 0 15px #2ecc71)";
            setTimeout(() => p.style.filter = "none", 150);
        }
    },

    updateScoreboard() {
        const count = this.collectedLetters.size;
        document.getElementById('score-val').innerText = count;
        const p = count / 26;
        document.getElementById('sunny-bg').style.opacity = p;
    },

    celebrate() {
        const icons = ['✨', '🎉', '🅰️', '🔤', '🎈', '☀️'];
        for(let i=0; i<30; i++) {
            setTimeout(() => {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.innerText = icons[Math.floor(Math.random() * icons.length)];
                c.style.left = Math.random() * 100 + 'vw';
                document.getElementById('game-box').appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }, i * 100);
        }
    },

    end(win) {
        this.active = false;
        const screen = document.getElementById('end-screen');
        screen.classList.remove('hide');
        if(win) {
            this.items.forEach(item => item.el.remove());
            this.items = [];

            const sunny = document.getElementById('sunny-bg');
            sunny.style.transition = "none"; 
            sunny.style.opacity = 1;

            screen.classList.add('win-style');
            document.getElementById('res-title').innerText = "☀️ ALPHABET COMPLETE!";
            this.celebrate();
        } else {
            document.getElementById('res-title').innerText = "⛈️ GAME OVER";
        }
        document.getElementById('res-stats').innerText = `Letters Collected: ${this.collectedLetters.size}/26\nTime: ${document.getElementById('timer-val').innerText}s`;
    }
};

Game.initTracker();
</script>
</body>
</html>
